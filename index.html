<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arstotzka Republik | Zentrales Aktenregister</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#101214;--panel:#191c20;--panel2:#20242a;--line:#343a42;
  --red:#8d171b;--red2:#b42329;--gold:#c6a85b;--text:#ece8df;--muted:#9ca1a8;
  --green:#3e8c61;--yellow:#b58b35;--danger:#a62b31;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#24272c 0,#101214 45%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:
linear-gradient(#0008,#0008),url("Arstotzka.png") center/cover fixed}
.loginbox{width:min(440px,100%);background:#141619ee;border:1px solid #575c62;box-shadow:0 25px 70px #000b;padding:32px}
.logo{width:86px;height:86px;object-fit:cover;border:2px solid var(--gold);display:block;margin:0 auto 18px}
.loginbox h1{text-align:center;font-size:21px;letter-spacing:1px;margin:0}
.loginbox h2{text-align:center;font-size:12px;color:var(--gold);letter-spacing:3px;font-weight:normal;margin:8px 0 28px}
.loginlabel{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:1px;margin:14px 0 6px}
.loginbox input{width:100%;padding:12px;background:#0d0f11;border:1px solid #41464d;color:white;outline:none}
.loginbox input:focus{border-color:var(--gold)}
.loginbtn{width:100%;margin-top:22px;padding:13px;border:0;background:var(--red);color:white;font-weight:bold;letter-spacing:1px}
.loginbtn:hover{background:var(--red2)}
.warning{margin-top:18px;padding:10px;border-left:3px solid var(--gold);background:#28251d;color:#bbb;font-size:11px;line-height:1.5}
.loginerror{color:#ff8585;text-align:center;font-size:12px;margin-top:12px;min-height:16px}

/* APP */
#app{min-height:100vh}
.topbar{height:64px;background:#141619;border-bottom:1px solid #363a40;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px;font-weight:bold;letter-spacing:1px}
.brand img{width:38px;height:38px;object-fit:cover;border:1px solid var(--gold)}
.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:2px;margin-top:3px}
.userbox{font-size:11px;color:#bbb;text-align:right}
.userbox b{color:white}
.layout{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:235px;background:#151719;border-right:1px solid #34383e;padding:14px 10px}
.navtitle{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:2px;padding:12px 10px 7px}
.nav button{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#b9bdc2;padding:11px 12px;margin:3px 0;font-size:12px}
.nav button:hover,.nav button.active{background:#26292e;border-color:#3a3e44;color:white}
.nav button.active{border-left:3px solid var(--red2)}
.logout{margin-top:18px!important;color:#d97979!important}
main{flex:1;padding:25px;min-width:0}
.pagehead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}
.pagehead h1{margin:0;font-size:25px}
.pagehead p{margin:6px 0 0;color:var(--muted);font-size:12px}
.stamp{border:1px solid #514c3b;color:var(--gold);padding:7px 10px;font-size:10px;letter-spacing:1px;background:#1e1d18}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:linear-gradient(145deg,#1c1f23,#17191c);border:1px solid var(--line);padding:18px;box-shadow:0 8px 24px #0004}
.stat .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat .num{font-size:30px;font-weight:bold;margin-top:9px}
.stat .sub{font-size:10px;color:#777;margin-top:4px}
.section{margin-top:18px}
.sectiontitle{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);border-bottom:1px solid #393d43;padding-bottom:9px;margin-bottom:12px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.quick button{padding:18px;background:#1a1d21;border:1px solid #353a40;color:#ddd;text-align:left}
.quick button:hover{border-color:#686e76;background:#22262b}
.quick b{display:block;margin-bottom:5px}
.quick span{font-size:11px;color:#888}

/* PERSONS */
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.toolbar input,.toolbar select,.form input,.form select,.form textarea{
  width:100%;background:#101214;border:1px solid #3b4047;color:#eee;padding:10px;outline:none
}
.toolbar input:focus,.form input:focus,.form select:focus,.form textarea:focus{border-color:#777}
.persons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.person{background:#1b1e22;border:1px solid #363b42;padding:15px;cursor:pointer}
.person:hover{border-color:#6c7076;transform:translateY(-1px)}
.personhead{display:flex;justify-content:space-between;gap:10px}
.person h3{margin:0;font-size:15px}
.file{color:var(--gold);font-size:10px;margin-top:4px}
.badge{display:inline-block;padding:4px 7px;font-size:9px;border:1px solid #555;text-transform:uppercase}
.badge.red{border-color:#8e3a3e;color:#ff9a9d}.badge.green{border-color:#35694d;color:#83d0a3}
.badge.yellow{border-color:#80662e;color:#e0bd68}
.personmeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px;color:#999;font-size:10px}
.personmeta b{display:block;color:#ddd;font-size:11px;margin-top:3px}

/* FORM */
.back{border:0;background:transparent;color:#aaa;padding:0;margin-bottom:15px}
.back:hover{color:white}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formfield label{display:block;font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.formfield.full{grid-column:1/-1}
.form textarea{min-height:95px;resize:vertical}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid #4a4f56;background:#24282d;color:#ddd;padding:10px 14px}
.btn:hover{background:#2d3238}
.btn.primary{background:var(--red);border-color:#a13a3e;color:#fff}
.btn.primary:hover{background:var(--red2)}
.btn.danger{background:#361b1d;border-color:#733238;color:#ffb2b4}
.notice{padding:10px 12px;background:#202329;border-left:3px solid var(--gold);font-size:11px;color:#aaa;margin-bottom:14px}

/* TABLE / LOG */
.tablewrap{overflow:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:700px}
th,td{padding:10px;border-bottom:1px solid #30343a;text-align:left}
th{background:#202329;color:#bbb;text-transform:uppercase;font-size:9px;letter-spacing:1px}
td{color:#ddd}
tr:hover td{background:#1e2125}
.logok{color:#79c99a}.logbad{color:#ff898d}
.empty{padding:25px;text-align:center;color:#777;border:1px dashed #3b3f45}

/* FAHNDUNG */
.searchrow{display:flex;gap:10px}
.searchrow>*{flex:1}
.fahndung{display:flex;justify-content:space-between;gap:15px;padding:14px;background:#1a1d21;border:1px solid #383d44;margin-bottom:9px}
.fahndung h3{margin:0;font-size:14px}.fahndung p{margin:6px 0;color:#999;font-size:11px}
.fahndung small{color:#777}

/* PRINT */
@media print{
  .topbar,.sidebar,.actions,.back{display:none!important}
  main{padding:0}.card,.person{box-shadow:none}
  body{background:white;color:black}
}
@media(max-width:1000px){
 .grid{grid-template-columns:repeat(2,1fr)}.persons{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
 .layout{display:block}.sidebar{width:100%;border-right:0;border-bottom:1px solid #333}
 .nav{display:grid;grid-template-columns:1fr 1fr}.navtitle{display:none}
 main{padding:15px}.grid,.persons,.quick,.formgrid{grid-template-columns:1fr}
 .pagehead{align-items:start;flex-direction:column}.topbar{padding:0 10px}
}
</style>
</head>
<body>

<section id="login">
  <div class="loginbox">
    <img src="Arstotzka.png" class="logo" alt="Arstotzka">
    <h1>DIE AKTE DER ARSTOTZKA REPUBLIK</h1>
    <h2>ZENTRALES VERWALTUNGSSYSTEM</h2>

    <div class="loginlabel">Benutzerkennung</div>
    <input id="username" autocomplete="username" placeholder="Benutzername">

    <div class="loginlabel">Passwort</div>
    <input id="password" type="password" autocomplete="current-password" placeholder="Passwort">

    <button class="loginbtn" onclick="login()">SYSTEMZUGANG HERSTELLEN</button>
    <div id="loginerror" class="loginerror"></div>

    <div class="warning">
      WARNHINWEIS: Jeder Zugriff auf dieses System wird im
      <b>Zugriffsprotokoll</b> mit Zeit, Benutzerkennung, Aktion und Ergebnis erfasst.
    </div>
  </div>
</section>

<section id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <img src="Arstotzka.png" alt="">
      <div>ARSTOTZKA <small>ZENTRALES AKTENREGISTER</small></div>
    </div>
    <div class="userbox">ANGEMELDET ALS<br><b id="currentUser">---</b></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="navtitle">Verwaltung</div>
      <div class="nav">
        <button id="nav-home" onclick="showHome()">▣ &nbsp; Startseite</button>
        <button id="nav-persons" onclick="showPersons()">▤ &nbsp; Personenakten</button>
        <button id="nav-search" onclick="showFahndungen()">⌕ &nbsp; Fahndungsregister</button>
        <button id="nav-stats" onclick="showStats()">▥ &nbsp; Statistik</button>
        <button id="nav-log" onclick="showLog()">▧ &nbsp; Zugriffsprotokoll</button>
        <button onclick="printRecord()">▤ &nbsp; Akte drucken</button>
        <button class="logout" onclick="logout()">↪ &nbsp; Abmelden</button>
      </div>
    </aside>

    <main id="content"></main>
  </div>
</section>

<script>
const SUPABASE_URL = "https://sdlrttsluqtuupapeymt.supabase.co";
const SUPABASE_KEY = "sb_publishable_2lRZ9Tw11ORGQEWeWVDqYg_x665jjdU";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const USERS = { arstotzka: "glory" };

const STANDARD_PERSONS = [
  ["0001","Maximillian Pütz"],["0002","Linus Gabriel Ersin Oster"],
  ["0003","Leon Wallenfang"],["0004","Oskar Michels"],
  ["0005","Tammo Kress"],["0006","Albert Wünscher"],
  ["0007","Lukas Hilberath"],["0008","Diego Fernando Schaefer"],
  ["0009","Jakob Findeisen"]
];

let currentUser = null;
let currentPerson = null;

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function notify(msg){
  alert(msg);
}
async function logAccess(action, details="", success=true, user=currentUser || "unbekannt"){
  const {error} = await db.from("system_protokoll").insert({
    aktion: action, benutzer: user, details: details, erfolgreich: success
  });
  if(error) console.warn("Protokoll konnte nicht geschrieben werden:", error.message);
}

async function login(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  const error = document.getElementById("loginerror");

  if(USERS[u] !== p){
    error.textContent = "Zugriff verweigert. Benutzerkennung oder Passwort ungültig.";
    await logAccess("UNBEFUGTER ZUGRIFF", "Fehlgeschlagener Loginversuch: " + (u || "keine Kennung"), false, u || "unbekannt");
    return;
  }

  currentUser = u;
  sessionStorage.setItem("arstotzka_user", u);
  await logAccess("LOGIN ERFOLGREICH", "Systemzugang hergestellt", true, u);
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("currentUser").textContent = u.toUpperCase();
  await initializePersons();
  showHome();
}

async function logout(){
  if(currentUser) await logAccess("ABMELDUNG", "Benutzer hat die Sitzung beendet", true);
  sessionStorage.removeItem("arstotzka_user");
  currentUser = null;
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("username").value="";
  document.getElementById("password").value="";
}

async function initializePersons(){
  for(const [aktennummer,name] of STANDARD_PERSONS){
    const {data} = await db.from("personen").select("id").eq("aktennummer",aktennummer).maybeSingle();
    if(!data){
      await db.from("personen").insert({aktennummer,name,status:"Aktiv",kategorie:"Zivilperson",gefaehrdungsstufe:"Keine Einstufung"});
    }
  }
}

function setNav(id){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  const el=document.getElementById(id); if(el) el.classList.add("active");
}

async function showHome(){
  setNav("nav-home");
  const {count:persons}=await db.from("personen").select("*",{count:"exact",head:true});
  const {count:fahndungen}=await db.from("fahndungen").select("*",{count:"exact",head:true});
  const {count:logs}=await db.from("system_protokoll").select("*",{count:"exact",head:true});
  document.getElementById("content").innerHTML=`
    <div class="pagehead"><div><h1>Systemübersicht</h1><p>Zentrale Verwaltungsoberfläche der Arstotzka Republik</p></div><div class="stamp">AMTLICH · INTERN</div></div>
    <div class="grid">
      <div class="card stat"><div class="label">Personenakten</div><div class="num">${persons??0}</div><div class="sub">registrierte Datensätze</div></div>
      <div class="card stat"><div class="label">Fahndungen</div><div class="num">${fahndungen??0}</div><div class="sub">aktive Einträge im Register</div></div>
      <div class="card stat"><div class="label">Protokolleinträge</div><div class="num">${logs??0}</div><div class="sub">Zugriffe und Systemaktionen</div></div>
      <div class="card stat"><div class="label">Systemstatus</div><div class="num" style="font-size:20px;color:#79c99a">ONLINE</div><div class="sub">Datenbank verbunden</div></div>
    </div>
    <div class="section">
      <div class="sectiontitle">Schnellzugriff</div>
      <div class="quick">
        <button onclick="showPersons()"><b>Personenakten</b><span>Person suchen und Akten bearbeiten</span></button>
        <button onclick="showFahndungen()"><b>Fahndungsregister</b><span>Aktuelle Fahndungen einsehen</span></button>
        <button onclick="showLog()"><b>Zugriffsprotokoll</b><span>Systemzugriffe und Anmeldungen prüfen</span></button>
      </div>
    </div>
    <div class="section">
      <div class="sectiontitle">Systemhinweis</div>
      <div class="notice">Alle Änderungen an Personenakten, Fahndungen und Benutzerzugriffen werden soweit vorgesehen im System protokolliert.</div>
    </div>`;
}

async function showPersons(){
  setNav("nav-persons");
  document.getElementById("content").innerHTML=`
    <div class="pagehead"><div><h1>Personenakten</h1><p>Registrierte Personen des zentralen Aktenbestands</p></div></div>
    <div class="toolbar"><input id="personSearch" placeholder="Name oder Aktennummer suchen..." oninput="renderPersons()"></div>
    <div id="persons" class="persons"><div class="empty">Daten werden geladen...</div></div>`;
  await renderPersons();
}

async function renderPersons(){
  const {data,error}=await db.from("personen").select("*").order("aktennummer");
  const box=document.getElementById("persons");
  if(!box)return;
  if(error){box.innerHTML=`<div class="empty">Fehler beim Laden: ${esc(error.message)}</div>`;return}
  const q=(document.getElementById("personSearch")?.value||"").toLowerCase();
  const list=(data||[]).filter(p=>(p.name+" "+p.aktennummer).toLowerCase().includes(q));
  if(!list.length){box.innerHTML='<div class="empty">Keine passende Akte gefunden.</div>';return}
  box.innerHTML=list.map(p=>`
    <div class="person" onclick="openPerson(${p.id})">
      <div class="personhead"><div><h3>${esc(p.name)}</h3><div class="file">AKTE ${esc(p.aktennummer)}</div></div><span class="badge ${p.gefaehrdungsstufe==="Kritisch"?"red":p.gefaehrdungsstufe==="Hoch"?"yellow":"green"}">${esc(p.status||"Aktiv")}</span></div>
      <div class="personmeta">
        <div>Kategorie<b>${esc(p.kategorie||"Nicht angegeben")}</b></div>
        <div>Gefährdung<b>${esc(p.gefaehrdungsstufe||"Keine Einstufung")}</b></div>
        <div>Geburtsort<b>${esc(p.geburtsort||"Nicht erfasst")}</b></div>
        <div>Beruf<b>${esc(p.beruf||"Nicht erfasst")}</b></div>
      </div>
    </div>`).join("");
}

function inputField(label,key,value="",full=false){
  return `<div class="formfield ${full?"full":""}"><label>${label}</label><input id="f_${key}" value="${esc(value)}"></div>`;
}
function selectField(label,key,value,options,full=false){
  return `<div class="formfield ${full?"full":""}"><label>${label}</label><select id="f_${key}">${options.map(o=>`<option ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
}
function areaField(label,key,value="",full=true){
  return `<div class="formfield ${full?"full":""}"><label>${label}</label><textarea id="f_${key}">${esc(value)}</textarea></div>`;
}

async function openPerson(id){
  const {data:p,error}=await db.from("personen").select("*").eq("id",id).single();
  if(error){notify(error.message);return}
  currentPerson=p;
  await logAccess("AKTE GEÖFFNET","Akte "+p.aktennummer+" / "+p.name,true);
  document.getElementById("content").innerHTML=`
    <button class="back" onclick="showPersons()">← Zurück zu Personenakten</button>
    <div class="pagehead"><div><h1>${esc(p.name)}</h1><p>Akte ${esc(p.aktennummer)} · zuletzt aktualisiert ${formatDate(p.aktualisiert_am)}</p></div><div class="stamp">VERTRAULICH · INTERN</div></div>
    <div class="notice">Änderungen werden beim Speichern in der Aktenhistorie vermerkt.</div>

    <div class="card">
      <div class="sectiontitle">Personendaten</div>
      <div class="formgrid">
        ${inputField("Name","name",p.name)}
        ${inputField("Geburtsdatum","geburtsdatum",p.geburtsdatum)}
        ${inputField("Geburtsort","geburtsort",p.geburtsort)}
        ${selectField("Geschlecht","geschlecht",p.geschlecht,["","Männlich","Weiblich","Divers"])}
        ${inputField("Staatsangehörigkeit","staatsangehoerigkeit",p.staatsangehoerigkeit)}
        ${selectField("Familienstand","familienstand",p.familienstand,["","Ledig","Verheiratet","Geschieden","Verwitwet"])}
        ${inputField("Beruf","beruf",p.beruf)}
        ${inputField("Dienstgrad","dienstgrad",p.dienstgrad)}
      </div>
    </div>

    <div class="card section">
      <div class="sectiontitle">Äußere Merkmale</div>
      <div class="formgrid">
        ${inputField("Größe","groesse",p.groesse)}
        ${inputField("Gewicht","gewicht",p.gewicht)}
        ${inputField("Augenfarbe","augenfarbe",p.augenfarbe)}
        ${inputField("Haarfarbe","haarfarbe",p.haarfarbe)}
        ${inputField("Besondere Merkmale","besondere_merkmale",p.besondere_merkmale,true)}
      </div>
    </div>

    <div class="card section">
      <div class="sectiontitle">Behördliche Einstufung</div>
      <div class="formgrid">
        ${selectField("Status","status",p.status,["Aktiv","Inaktiv","In Bearbeitung","Unter Beobachtung","Abgeschlossen"])}
        ${selectField("Kategorie","kategorie",p.kategorie,["Zivilperson","Beamter","Militär","Staatsbediensteter","Verdächtiger","Zeuge"])}
        ${selectField("Gefährdungsstufe","gefaehrdungsstufe",p.gefaehrdungsstufe,["Keine Einstufung","Niedrig","Mittel","Hoch","Kritisch"])}
        ${inputField("Zuständige Behörde","zustaendige_behoerde",p.zustaendige_behoerde)}
        ${inputField("Zuständiger Beamter","zustaendiger_beamter",p.zustaendiger_beamter)}
      </div>
    </div>

    <div class="card section">
      <div class="sectiontitle">Rechtliche Vorgänge</div>
      <div class="formgrid">
        ${areaField("Vorstrafen","vorstrafen",p.vorstrafen)}
        ${areaField("Bekannte Delikte","bekannte_delikte",p.bekannte_delikte)}
        ${areaField("Laufende Verfahren","laufende_verfahren",p.laufende_verfahren)}
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" onclick="savePerson()">Akte speichern</button>
      <button class="btn" onclick="printRecord()">Akte drucken</button>
    </div>

    <div class="card section">
      <div class="sectiontitle">Neue Aktennotiz</div>
      <div class="formgrid"><div class="formfield full"><textarea id="newNote" placeholder="Interne Notiz..."></textarea></div></div>
      <div class="actions"><button class="btn" onclick="saveNote()">Notiz hinzufügen</button></div>
    </div>

    <div class="card section">
      <div class="sectiontitle">Aktenhistorie</div>
      <div id="history"><div class="empty">Lade Historie...</div></div>
    </div>`;
  await loadHistory(id);
}

async function savePerson(){
  if(!currentPerson)return;
  const keys=["name","geburtsdatum","geburtsort","geschlecht","staatsangehoerigkeit","familienstand","beruf","dienstgrad","groesse","gewicht","augenfarbe","haarfarbe","besondere_merkmale","status","kategorie","gefaehrdungsstufe","vorstrafen","bekannte_delikte","laufende_verfahren","zustaendige_behoerde","zustaendiger_beamter"];
  const update={};
  keys.forEach(k=>update[k]=document.getElementById("f_"+k)?.value||"");
  update.aktualisiert_am=new Date().toISOString();
  const {error}=await db.from("personen").update(update).eq("id",currentPerson.id);
  if(error){notify("Fehler: "+error.message);return}
  await db.from("akten_historie").insert({personen_id:currentPerson.id,aktion:"Akte aktualisiert durch "+currentUser});
  await logAccess("AKTE GEÄNDERT","Akte "+currentPerson.aktennummer+" / "+update.name,true);
  notify("Personenakte erfolgreich gespeichert.");
  await openPerson(currentPerson.id);
}

async function saveNote(){
  const note=document.getElementById("newNote")?.value.trim();
  if(!note||!currentPerson)return;
  const {error}=await db.from("akten_notizen").insert({personen_id:currentPerson.id,notiz:note});
  if(error){notify(error.message);return}
  await db.from("akten_historie").insert({personen_id:currentPerson.id,aktion:"Neue Aktennotiz durch "+currentUser});
  await logAccess("AKTENNOTIZ","Notiz zu Akte "+currentPerson.aktennummer+" hinzugefügt",true);
  document.getElementById("newNote").value="";
  await loadHistory(currentPerson.id);
  notify("Notiz gespeichert.");
}

async function loadHistory(id){
  const box=document.getElementById("history"); if(!box)return;
  const {data:h}=await db.from("akten_historie").select("*").eq("personen_id",id).order("erstellt_am",{ascending:false});
  const {data:n}=await db.from("akten_notizen").select("*").eq("personen_id",id).order("erstellt_am",{ascending:false});
  const all=[...(h||[]).map(x=>({date:x.erstellt_am,text:x.aktion,type:"Historie"})),...(n||[]).map(x=>({date:x.erstellt_am,text:x.notiz,type:"Notiz"}))].sort((a,b)=>new Date(b.date)-new Date(a.date));
  box.innerHTML=all.length?all.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #30343a"><span class="badge">${esc(x.type)}</span> <b>${esc(x.text)}</b><br><small style="color:#777">${formatDate(x.date)}</small></div>`).join(""):'<div class="empty">Keine Einträge vorhanden.</div>';
}

async function showFahndungen(){
  setNav("nav-search");
  document.getElementById("content").innerHTML=`
    <div class="pagehead"><div><h1>Fahndungsregister</h1><p>Zentrale Übersicht der ausgeschriebenen Personen</p></div></div>
    <div class="card">
      <div class="searchrow"><input id="fhName" placeholder="Name"><input id="fhGrund" placeholder="Grund / Delikt"><select id="fhStatus"><option>Gesucht</option><option>Dringend gesucht</option><option>Zur Festnahme ausgeschrieben</option><option>Staatssicherheitsrelevant</option></select><select id="fhPrio"><option>Normal</option><option>Hoch</option><option>Kritisch</option></select><button class="btn primary" onclick="addFahndung()">Eintragen</button></div>
    </div>
    <div class="section"><div id="fahndungen"></div></div>`;
  await renderFahndungen();
}

async function addFahndung(){
  const name=document.getElementById("fhName").value.trim(), grund=document.getElementById("fhGrund").value.trim();
  const status=document.getElementById("fhStatus").value, prio=document.getElementById("fhPrio").value;
  if(!name||!grund){notify("Name und Grund müssen ausgefüllt werden.");return}
  const {error}=await db.from("fahndungen").insert({name,grund,status:status+" | Priorität: "+prio});
  if(error){notify(error.message);return}
  await logAccess("FAHNDUNG ANGELEGT",""+name+" / "+grund,true);
  notify("Fahndung erfolgreich eingetragen.");
  document.getElementById("fhName").value="";document.getElementById("fhGrund").value="";
  await renderFahndungen();
}

async function renderFahndungen(){
  const box=document.getElementById("fahndungen");if(!box)return;
  const {data,error}=await db.from("fahndungen").select("*").order("created_at",{ascending:false});
  if(error){box.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}
  if(!data?.length){box.innerHTML='<div class="empty">Keine Fahndungen vorhanden.</div>';return}
  box.innerHTML=data.map(f=>`<div class="fahndung"><div><h3>${esc(f.name)}</h3><p>${esc(f.grund)}</p><small>${formatDate(f.created_at)}</small></div><div><span class="badge red">${esc(f.status)}</span><br><button class="btn danger" style="margin-top:8px" onclick="deleteFahndung(${f.id})">Löschen</button></div></div>`).join("");
}

async function deleteFahndung(id){
  if(!confirm("Diesen Fahndungseintrag wirklich löschen?"))return;
  const {error}=await db.from("fahndungen").delete().eq("id",id);
  if(error){notify(error.message);return}
  await logAccess("FAHNDUNG GELÖSCHT","Eintrag ID "+id+" gelöscht",true);
  await renderFahndungen();
}

  const {data:fahndungen}=await db.from("fahndungen").select("status");

    </div>
    <div class="card section">

        <div class="card"><b>Beamte</b><br><span class="sub">${count(persons,"kategorie","Beamter")}</span></div>
        <div class="card"><b>Militär</b><br><span class="sub">${count(persons,"kategorie","Militär")}</span></div>
        <div class="card"><b>Verdächtige</b><br><span class="sub">${count(persons,"kategorie","Verdächtiger")}</span></div>
      </div>
    </div>`;
}

async function showLog(){
  setNav("nav-log");
  document.getElementById("content").innerHTML=`
    <div class="pagehead"><div><h1>Zugriffsprotokoll</h1><p>Dokumentation der Systemzugriffe und wichtigen Aktionen</p></div><div class="stamp">SICHERHEITSRELEVANT</div></div>
    <div class="notice">Das Protokoll enthält keine IP-Adresse. Erfasst werden Benutzerkennung, Zeitpunkt, Aktion, Details und Ergebnis.</div>
    <div class="tablewrap"><table><thead><tr><th>Zeit</th><th>Benutzer</th><th>Aktion</th><th>Details</th><th>Ergebnis</th></tr></thead><tbody id="logbody"><tr><td colspan="5">Lade Protokoll...</td></tr></tbody></table></div>`;
  const {data,error}=await db.from("system_protokoll").select("*").order("erstellt_am",{ascending:false}).limit(200);
  const body=document.getElementById("logbody");
  if(error){body.innerHTML=`<tr><td colspan="5">${esc(error.message)}</td></tr>`;return}
  body.innerHTML=(data||[]).map(x=>`<tr><td>${formatDate(x.erstellt_am)}</td><td>${esc(x.benutzer)}</td><td><b>${esc(x.aktion)}</b></td><td>${esc(x.details)}</td><td class="${x.erfolgreich?"logok":"logbad"}">${x.erfolgreich?"ERFOLGREICH":"ABGELEHNT"}</td></tr>`).join("")||'<tr><td colspan="5">Keine Einträge.</td></tr>';
}

function formatDate(v){
  if(!v)return"—";
  return new Date(v).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"medium"});
}
function printRecord(){
  if(!currentPerson){window.print();return}
  logAccess("AKTE GEDRUCKT","Akte "+currentPerson.aktennummer+" / "+currentPerson.name,true);
  window.print();
}

window.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !document.getElementById("login").classList.contains("hidden")) login();
});

window.addEventListener("load",()=>{
  const u=sessionStorage.getItem("arstotzka_user");
  if(u=== "arstotzka"){
    currentUser=u;
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("currentUser").textContent=u.toUpperCase();
    initializePersons().then(showHome);
  }
});
</script>
