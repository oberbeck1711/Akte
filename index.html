<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arstotzka Aktenverwaltung</title>


    <style>

        body {

            margin: 0;

            font-family: Arial, Helvetica, sans-serif;

            background: #1b1b1b;

            color: #222;

        }


        /* ========================= */
        /* LOGIN                     */
        /* ========================= */

        #login {

            width: 400px;

            margin: 100px auto;

            background: #e8e4d8;

            padding: 30px;

            border: 5px solid #333;

            box-shadow: 0 0 20px black;

            text-align: center;

        }


        #login img {

            width: 180px;

            margin-bottom: 20px;

        }


        #login h1 {

            font-size: 24px;

            margin-bottom: 25px;

        }


        input,
        select {

            width: 100%;

            box-sizing: border-box;

            padding: 10px;

            margin-top: 5px;

            margin-bottom: 15px;

            border: 2px solid #555;

            background: #f5f2e8;

            font-size: 15px;

        }


        button {

            padding: 10px 15px;

            border: 2px solid #333;

            background: #555;

            color: white;

            cursor: pointer;

            font-weight: bold;

        }


        button:hover {

            background: #333;

        }


        #error {

            color: #8b0000;

            font-weight: bold;

            margin-top: 15px;

        }


        /* ========================= */
        /* SYSTEM                    */
        /* ========================= */

        #system {

            display: none;

        }


        .topbar {

            background: #252525;

            color: white;

            padding: 15px 25px;

            border-bottom: 4px solid #8b0000;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .topbar h2 {

            margin: 0;

        }


        .topbar span {

            font-size: 13px;

            color: #ccc;

        }


        .container {

            display: flex;

            min-height: calc(100vh - 70px);

        }


        /* ========================= */
        /* SIDEBAR                   */
        /* ========================= */

        .sidebar {

            width: 220px;

            background: #292929;

            padding: 20px;

            box-sizing: border-box;

        }


        .sidebar button {

            width: 100%;

            margin-bottom: 10px;

            text-align: left;

        }


        /* ========================= */
        /* CONTENT                   */
        /* ========================= */

        .content {

            flex: 1;

            padding: 30px;

            background: #c9c5b8;

            min-height: calc(100vh - 70px);

            box-sizing: border-box;

        }


        .document {

            max-width: 900px;

            margin: auto;

            background: #eee9da;

            padding: 30px;

            border: 3px solid #333;

            box-shadow: 0 0 10px #555;

        }


        .document h1 {

            margin-top: 0;

            border-bottom: 3px solid #333;

            padding-bottom: 10px;

        }


        .document h2 {

            margin-top: 30px;

            border-bottom: 2px solid #555;

            padding-bottom: 5px;

        }


        .document h3 {

            margin-top: 0;

        }


        .field {

            background: #f7f3e8;

            border: 1px solid #999;

            padding: 15px;

            margin: 10px 0;

        }


        .field button {

            margin-top: 10px;

        }


        .warning {

            color: #8b0000;

            font-weight: bold;

        }


        .success {

            color: #176b17;

            font-weight: bold;

        }


        /* ========================= */
        /* PERSONENLISTE              */
        /* ========================= */

        .person-button {

            width: 100%;

            text-align: left;

            background: #555;

            padding: 15px;

            font-size: 16px;

        }


        .person-button:hover {

            background: #333;

        }


        /* ========================= */
        /* MOBILE                    */
        /* ========================= */

        @media (max-width: 700px) {

            #login {

                width: 90%;

                box-sizing: border-box;

            }


            .container {

                flex-direction: column;

            }


            .sidebar {

                width: 100%;

            }


            .content {

                padding: 15px;

            }

        }

    </style>

</head>


<body>


<!-- ========================= -->
<!-- LOGIN                     -->
<!-- ========================= -->

<div id="login">

    <img src="Arstotzka.png" alt="Glory to Arstotzka">

    <h1>
        DIE AKTE DER ARSTOTZKA REPUBLIK
    </h1>


    <input
        type="text"
        id="username"
        placeholder="Benutzername"
    >


    <input
        type="password"
        id="password"
        placeholder="Passwort"
    >


    <button onclick="login()">
        ANMELDEN
    </button>


    <div id="error"></div>

</div>



<!-- ========================= -->
<!-- SYSTEM                    -->
<!-- ========================= -->

<div id="system">


    <div class="topbar">

        <h2>
            ARSTOTZKA REPUBLIK
        </h2>

        <span>
            INTERNES AKTENSYSTEM
        </span>

    </div>



    <div class="container">


        <!-- ========================= -->
        <!-- SIDEBAR                   -->
        <!-- ========================= -->

        <div class="sidebar">


            <button onclick="zeigeStartseite()">
                STARTSEITE
            </button>


            <button onclick="zeigePersonen()">
                PERSONENAKTEN
            </button>


            <button onclick="zeigeFahndung()">
                FAHNDUNG
            </button>


            <button onclick="logout()">
                ABMELDEN
            </button>


        </div>



        <!-- ========================= -->
        <!-- CONTENT                   -->
        <!-- ========================= -->

        <div class="content" id="content">


            <div class="document">

                <h1>
                    WILLKOMMEN
                </h1>

                <p>
                    Willkommen im internen Aktenverwaltungssystem
                    der Republik Arstotzka.
                </p>

                <p>
                    Wählen Sie links einen Bereich aus.
                </p>

            </div>


        </div>


    </div>


</div>



<script>


/* ========================= */
/* LOGIN                     */
/* ========================= */

const BENUTZERNAME = "REPUBLIKADMIN";

const PASSWORT = "ALLFDL1574";


function login() {


    let username =
        document.getElementById("username").value;


    let password =
        document.getElementById("password").value;


    if (
        username === BENUTZERNAME &&
        password === PASSWORT
    ) {


        document.getElementById("login").style.display =
            "none";


        document.getElementById("system").style.display =
            "block";


        zeigeStartseite();


    } else {


        document.getElementById("error").innerText =
            "ZUGRIFF VERWEIGERT";


    }

}



/* ========================= */
/* LOGOUT                    */
/* ========================= */

function logout() {


    document.getElementById("system").style.display =
        "none";


    document.getElementById("login").style.display =
        "block";


    document.getElementById("username").value = "";

    document.getElementById("password").value = "";

    document.getElementById("error").innerText = "";


}



/* ========================= */
/* STARTSEITE                */
/* ========================= */

function zeigeStartseite() {


    document.getElementById("content").innerHTML = `

        <div class="document">

            <h1>
                INTERNES AKTENSYSTEM
            </h1>

            <p>
                Willkommen im zentralen
                Aktenverwaltungssystem der
                Republik Arstotzka.
            </p>

            <div class="field">

                <strong>
                    SYSTEMSTATUS:
                </strong>

                <span class="success">
                    AKTIV
                </span>

            </div>


            <div class="field">

                <strong>
                    ZUGRIFF:
                </strong>

                AUTORISIERT

            </div>


            <div class="field">

                <strong>
                    VERFÜGBARE BEREICHE:
                </strong>

                <br><br>

                Personenakten<br>

                Fahndung

            </div>

        </div>

    `;

}



/* ========================= */
/* PERSONENAKTEN             */
/* ========================= */

function zeigePersonen() {


    document.getElementById("content").innerHTML = `

        <div class="document">

            <h1>
                PERSONENAKTEN
            </h1>

            <p>
                Wählen Sie eine Akte aus:
            </p>


            <div class="field">

                <button
                    class="person-button"
                    onclick="zeigeAkte('Maximillian Pütz')">

                    Maximillian Pütz

                </button>

            </div>


            <div class="field">

                <button
                    class="person-button"
                    onclick="zeigeAkte('Linus Gabriel Ersin Oster')">

                    Linus Gabriel Ersin Oster

                </button>

            </div>


            <div class="field">

                <button
                    class="person-button"
                    onclick="zeigeAkte('Leon Wallenfang')">

                    Leon Wallenfang

                </button>

            </div>


            <div class="field">

                <button
                    class="person-button"
                    onclick="zeigeAkte('Oskar Michels')">

                    Oskar Michels

                </button>

            </div>


            <div class="field">

                <button
                    class="person-button"
                    onclick="zeigeAkte('Tammo Kress')">

                    Tammo Kress

                </button>

            </div>


            <div class="field">

                <button
                    class="person-button"
                    onclick="zeigeAkte('Albert Wünscher')">

                    Albert Wünscher

                </button>

            </div>


            <div class="field">

                <button
                    class="person-button"
                    onclick="zeigeAkte('Lukas Hilberath')">

                    Lukas Hilberath

                </button>

            </div>


            <div class="field">

                <button
                    class="person-button"
                    onclick="zeigeAkte('Diego Fernando Schaefer')">

                    Diego Fernando Schaefer

                </button>

            </div>


        </div>

    `;

}



/* ========================= */
/* PERSONENAKTE              */
/* ========================= */

function zeigeAkte(name) {


    let fahndungen =
        JSON.parse(
            localStorage.getItem("fahndungen")
        ) || [];


    let personenFahndungen =
        fahndungen.filter(
            f => f.name === name
        );


    let fahndungsHTML = "";


    if (personenFahndungen.length === 0) {


        fahndungsHTML = `

            <div class="field">

                <span>
                    Keine Fahndung eingetragen.
                </span>

            </div>

        `;


    } else {


        personenFahndungen.forEach(f => {


            fahndungsHTML += `

                <div class="field">

                    <h3>
                        FAHNDUNG
                    </h3>

                    <strong>
                        Grund:
                    </strong>

                    ${f.grund}

                    <br><br>

                    <strong>
                        Status:
                    </strong>

                    <span class="warning">
                        ${f.status}
                    </span>

                    <br><br>

                    <button
                        onclick="loescheFahndung(${f.id}, '${name}')">

                        FAHNDUNG LÖSCHEN

                    </button>

                </div>

            `;

        });

    }



    document.getElementById("content").innerHTML = `

        <div class="document">


            <h1>
                PERSONENAKTE
            </h1>


            <div class="field">

                <strong>
                    Name:
                </strong>

                ${name}

            </div>


            <div class="field">

                <strong>
                    Aktennummer:
                </strong>

                AR-${personenNummer(name)}

            </div>


            <div class="field">

                <strong>
                    Staatsangehörigkeit:
                </strong>

                Arstotzkanisch

            </div>


            <div class="field">

                <strong>
                    Status:
                </strong>

                Aktiv

            </div>



            <h2>
                FAHNDUNG
            </h2>


            ${fahndungsHTML}



            <h2>
                NEUE FAHNDUNG EINTRAGEN
            </h2>


            <div class="field">


                <label>
                    Fahndungsgrund:
                </label>


                <input
                    type="text"
                    id="fahndungsgrund"
                    placeholder="z.B. Schwerer Diebstahl"
                >


                <label>
                    Status:
                </label>


                <select id="fahndungsstatus">

                    <option value="Gesucht">
                        Gesucht
                    </option>

                    <option value="Dringend gesucht">
                        Dringend gesucht
                    </option>

                    <option value="Zur Festnahme ausgeschrieben">
                        Zur Festnahme ausgeschrieben
                    </option>

                </select>


                <button
                    onclick="fuegeFahndungHinzu('${name}')">

                    FAHNDUNG EINTRAGEN

                </button>


            </div>



            <button onclick="zeigePersonen()">

                ← ZURÜCK ZU DEN PERSONENAKTEN

            </button>


        </div>

    `;

}



/* ========================= */
/* AKTENNUMMERN              */
/* ========================= */

function personenNummer(name) {


    const nummern = {

        "Maximillian Pütz": "0001",

        "Linus Gabriel Ersin Oster": "0002",

        "Leon Wallenfang": "0003",

        "Oskar Michels": "0004",

        "Tammo Kress": "0005",

        "Albert Wünscher": "0006",

        "Lukas Hilberath": "0007",

        "Diego Fernando Schaefer": "0008"

    };


    return nummern[name] || "9999";

}



/* ========================= */
/* FAHNDUNG HINZUFÜGEN       */
/* ========================= */

function fuegeFahndungHinzu(name) {


    let grund =
        document.getElementById(
            "fahndungsgrund"
        ).value;


    let status =
        document.getElementById(
            "fahndungsstatus"
        ).value;


    if (grund.trim() === "") {


        alert(
            "Bitte einen Fahndungsgrund eingeben."
        );


        return;

    }


    let fahndungen =
        JSON.parse(
            localStorage.getItem("fahndungen")
        ) || [];


    fahndungen.push({

        id: Date.now(),

        name: name,

        grund: grund,

        status: status

    });


    localStorage.setItem(
        "fahndungen",
        JSON.stringify(fahndungen)
    );


    zeigeAkte(name);

}



/* ========================= */
/* FAHNDUNG LÖSCHEN          */
/* ========================= */

function loescheFahndung(id, name) {


    let fahndungen =
        JSON.parse(
            localStorage.getItem("fahndungen")
        ) || [];


    fahndungen =
        fahndungen.filter(
            f => f.id !== id
        );


    localStorage.setItem(
        "fahndungen",
        JSON.stringify(fahndungen)
    );


    zeigeAkte(name);

}



/* ========================= */
/* FAHNDUNGSLISTE            */
/* ========================= */

function zeigeFahndung() {


    let fahndungen =
        JSON.parse(
            localStorage.getItem("fahndungen")
        ) || [];


    let liste = "";


    if (fahndungen.length === 0) {


        liste = `

            <div class="field">

                <span class="success">
                    AKTUELL KEINE PERSONEN ZUR
                    FAHNDUNG AUSGESCHRIEBEN.
                </span>

            </div>

        `;


    } else {


        fahndungen.forEach(f => {


            liste += `

                <div class="field">

                    <h3>
                        ${f.name}
                    </h3>


                    <strong>
                        Aktennummer:
                    </strong>

                    AR-${personenNummer(f.name)}

                    <br><br>


                    <strong>
                        Fahndungsgrund:
                    </strong>

                    ${f.grund}

                    <br><br>


                    <strong>
                        Status:
                    </strong>

                    <span class="warning">
                        ${f.status}
                    </span>

                    <br><br>


                    <button
                        onclick="zeigeAkte('${f.name}')">

                        PERSONENAKTE ÖFFNEN

                    </button>


                </div>

            `;

        });

    }



    document.getElementById("content").innerHTML = `

        <div class="document">


            <h1>
                FAHNDUNG
            </h1>


            <p>
                AKTUELLE PERSONENFAHNDUNGEN
            </p>


            ${liste}


        </div>

    `;

}


</script>


</body>

</html>
