<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arstotzka Republik | Internes Aktenregister</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* ================================================= */
/* GRUNDLAYOUT                                       */
/* ================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #333 0%, #171717 45%, #0d0d0d 100%);
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
}


/* ================================================= */
/* LOGIN                                             */
/* ================================================= */

#login {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.login-box {
    width: 440px;
    max-width: 100%;

    background: #e7e2d4;

    border: 4px solid #292929;

    box-shadow:
        0 0 0 2px #777,
        0 20px 60px rgba(0,0,0,.7);

    padding: 35px;

    text-align: center;
}

.login-box img {
    width: 190px;
    max-width: 70%;

    margin-bottom: 20px;
}

.login-box h1 {
    margin: 0 0 8px 0;

    font-size: 25px;

    letter-spacing: 1px;
}

.login-subtitle {
    color: #555;

    font-size: 13px;

    margin-bottom: 30px;
}

.login-warning {
    margin-top: 20px;

    padding: 10px;

    background: #d4cfc0;

    border-left: 4px solid #8b0000;

    font-size: 12px;

    text-align: left;
}

#error {
    color: #8b0000;

    font-weight: bold;

    margin-top: 15px;
}


/* ================================================= */
/* INPUTS                                            */
/* ================================================= */

input,
select,
textarea {

    width: 100%;

    padding: 12px;

    margin-top: 6px;
    margin-bottom: 15px;

    border: 2px solid #888;

    background: #faf8f0;

    color: #222;

    font-family: inherit;

    font-size: 15px;

}

textarea {
    min-height: 110px;

    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {

    outline: none;

    border-color: #8b0000;

}


/* ================================================= */
/* BUTTONS                                           */
/* ================================================= */

button {

    border: 2px solid #222;

    background: #4a4a4a;

    color: white;

    padding: 11px 15px;

    cursor: pointer;

    font-weight: bold;

    font-size: 14px;

    transition: .15s;

}

button:hover {

    background: #222;

}

button.danger {

    background: #7b0000;

}

button.danger:hover {

    background: #a00000;

}

button.secondary {

    background: #777;

}

button.small {

    padding: 7px 10px;

    font-size: 12px;

}


/* ================================================= */
/* SYSTEM                                            */
/* ================================================= */

#system {

    display: none;

    min-height: 100vh;

}


/* ================================================= */
/* TOPBAR                                            */
/* ================================================= */

.topbar {

    min-height: 70px;

    background:
        linear-gradient(#292929, #1c1c1c);

    color: white;

    border-bottom: 4px solid #8b0000;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 12px 25px;

}

.topbar-title {

    display: flex;

    align-items: center;

    gap: 15px;

}

.topbar-title strong {

    font-size: 20px;

    letter-spacing: 1px;

}

.topbar-title span {

    font-size: 11px;

    color: #aaa;

}

.top-status {

    font-size: 11px;

    color: #bdbdbd;

    text-align: right;

}

.status-dot {

    display: inline-block;

    width: 8px;

    height: 8px;

    background: #48a348;

    border-radius: 50%;

    margin-right: 5px;

}


/* ================================================= */
/* LAYOUT                                            */
/* ================================================= */

.container {

    display: flex;

    min-height: calc(100vh - 70px);

}


/* ================================================= */
/* SIDEBAR                                           */
/* ================================================= */

.sidebar {

    width: 240px;

    flex-shrink: 0;

    background: #242424;

    padding: 18px;

}

.sidebar-header {

    color: #aaa;

    font-size: 11px;

    letter-spacing: 1px;

    margin: 8px 5px 12px;

}

.sidebar button {

    display: block;

    width: 100%;

    text-align: left;

    margin-bottom: 8px;

}

.sidebar .logout {

    margin-top: 30px;

    background: #6d0000;

}


/* ================================================= */
/* CONTENT                                           */
/* ================================================= */

.content {

    flex: 1;

    min-width: 0;

    background: #bdb9ad;

    padding: 30px;

}

.document {

    max-width: 1100px;

    margin: 0 auto;

    background: #eae5d8;

    border: 3px solid #333;

    box-shadow: 0 8px 20px rgba(0,0,0,.35);

    padding: 30px;

}

.document-header {

    border-bottom: 3px solid #333;

    margin-bottom: 25px;

}

.document-header h1 {

    margin: 0 0 6px;

    font-size: 27px;

}

.document-header p {

    margin-top: 0;

    color: #666;

}


/* ================================================= */
/* CARDS                                             */
/* ================================================= */

.dashboard-grid {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 15px;

    margin-bottom: 25px;

}

.stat-card {

    background: #f4f0e5;

    border: 2px solid #999;

    padding: 18px;

}

.stat-title {

    font-size: 11px;

    color: #666;

    text-transform: uppercase;

}

.stat-number {

    font-size: 30px;

    font-weight: bold;

    margin-top: 7px;

}


/* ================================================= */
/* FIELD                                             */
/* ================================================= */

.field {

    background: #f6f2e7;

    border: 1px solid #999;

    padding: 16px;

    margin-bottom: 12px;

}

.field-title {

    font-size: 12px;

    color: #666;

    text-transform: uppercase;

    margin-bottom: 5px;

}

.field-value {

    font-weight: bold;

}


/* ================================================= */
/* PERSONEN                                          */
/* ================================================= */

.person-list {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;

}

.person-card {

    background: #f6f2e7;

    border: 2px solid #999;

    padding: 15px;

    cursor: pointer;

    transition: .15s;

}

.person-card:hover {

    border-color: #8b0000;

    transform: translateY(-1px);

}

.person-name {

    font-size: 17px;

    font-weight: bold;

}

.person-id {

    margin-top: 5px;

    color: #777;

    font-size: 12px;

}


/* ================================================= */
/* BADGES                                            */
/* ================================================= */

.badge {

    display: inline-block;

    padding: 5px 8px;

    margin: 3px;

    font-size: 11px;

    font-weight: bold;

    border: 1px solid #555;

    background: #ddd8ca;

}

.badge-danger {

    background: #b88;

    color: #4b0000;

}

.badge-warning {

    background: #d7c78c;

}

.badge-success {

    background: #a9c0a9;

}


/* ================================================= */
/* SEARCH                                            */
/* ================================================= */

.search-box {

    margin-bottom: 20px;

}

.search-box input {

    margin-bottom: 0;

}


/* ================================================= */
/* FAHNDUNG                                          */
/* ================================================= */

.fahndung-card {

    border-left: 7px solid #8b0000;

    background: #eee8db;

    border-top: 1px solid #999;

    border-right: 1px solid #999;

    border-bottom: 1px solid #999;

    padding: 18px;

    margin-bottom: 15px;

}

.fahndung-card h3 {

    margin: 0 0 10px;

}

.fahndung-meta {

    font-size: 12px;

    color: #666;

    margin-bottom: 12px;

}


/* ================================================= */
/* AKTENHISTORIE                                     */
/* ================================================= */

.history {

    border-left: 3px solid #555;

    padding-left: 15px;

}

.history-entry {

    margin-bottom: 15px;

    position: relative;

}

.history-entry::before {

    content: "";

    position: absolute;

    left: -21px;

    top: 3px;

    width: 9px;

    height: 9px;

    background: #555;

    border-radius: 50%;

}

.history-date {

    font-size: 11px;

    color: #777;

}


/* ================================================= */
/* WARNUNG                                           */
/* ================================================= */

.warning-box {

    background: #ded4c0;

    border-left: 6px solid #8b0000;

    padding: 15px;

    margin-bottom: 20px;

}

.warning-box strong {

    color: #720000;

}


/* ================================================= */
/* MOBILE NAVIGATION                                 */
/* ================================================= */

.mobile-menu {

    display: none;

    width: 100%;

    background: #242424;

    padding: 10px;

}

.mobile-menu button {

    width: 100%;

}


/* ================================================= */
/* RESPONSIVE                                        */
/* ================================================= */

@media (max-width: 900px) {

    .dashboard-grid {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

    }

}

@media (max-width: 700px) {

    .topbar {

        padding: 12px 15px;

    }

    .topbar-title strong {

        font-size: 15px;

    }

    .topbar-title span {

        display: none;

    }

    .top-status {

        font-size: 9px;

    }

    .container {

        flex-direction: column;

    }

    .sidebar {

        display: none;

    }

    .mobile-menu {

        display: block;

    }

    .content {

        padding: 12px;

    }

    .document {

        padding: 18px;

    }

    .person-list {

        grid-template-columns: 1fr;

    }

    .dashboard-grid {

        grid-template-columns: 1fr 1fr;

    }

    .document-header h1 {

        font-size: 21px;

    }

}

@media (max-width: 450px) {

    .dashboard-grid {

        grid-template-columns: 1fr;

    }

    .login-box {

        padding: 22px;

    }

}


/* ================================================= */
/* DRUCK                                             */
/* ================================================= */

@media print {

    .sidebar,
    .mobile-menu,
    .topbar {

        display: none !important;

    }

    .content {

        padding: 0;

        background: white;

    }

    .document {

        box-shadow: none;

        border: none;

    }

}

</style>

</head>


<body>


<!-- ================================================= -->
<!-- LOGIN                                             -->
<!-- ================================================= -->

<div id="login">

    <div class="login-box">

        <img
            src="Arstotzka.png"
            alt="Arstotzka"
        >

        <h1>
            REPUBLIK ARSTOTZKA
        </h1>

        <div class="login-subtitle">
            INTERNES AKTENVERWALTUNGSSYSTEM
        </div>


        <input
            id="username"
            type="text"
            placeholder="Benutzername"
            autocomplete="username"
        >


        <input
            id="password"
            type="password"
            placeholder="Passwort"

        >


        <button

        </button>

        <div class="login-warning">

            <strong>ACHTUNG</strong><br><br>

            Dieses System ist Eigentum der
            Republik Arstotzka.

            Unbefugter Zugriff wird protokolliert.

        </div>

    </div>

</div>



<!-- ================================================= -->
<!-- SYSTEM                                            -->
<!-- ================================================= -->

<div id="system">


    <div class="topbar">

        <div class="topbar-title">

            <strong>
                ARSTOTZKA
            </strong>

            <span>
                INTERNES AKTENREGISTER
            </span>

        </div>


        <div class="top-status">

            <span class="status-dot"></span>
            SYSTEM ONLINE

            <br>

            INTERN

        </div>

    </div>



    <!-- MOBILE MENU -->

    <div class="mobile-menu">

        <button onclick="zeigeStartseite()">
            ☰ MENÜ / STARTSEITE
        </button>

    </div>



    <div class="container">


        <!-- ================================================= -->
        <!-- SIDEBAR                                           -->
        <!-- ================================================= -->

        <aside class="sidebar">

            <div class="sidebar-header">
                HAUPTMENÜ
            </div>


            <button onclick="zeigeStartseite()">
                ▣ STARTSEITE
            </button>


            <button onclick="zeigePersonen()">
                ▤ PERSONENAKTEN
            </button>


            <button onclick="zeigeFahndung()">
                ⚠ FAHNDUNG
            </button>


            <div class="sidebar-header">
                SYSTEM
            </div>


            <button onclick="zeigeStatistik()">
                ▦ STATISTIK
            </button>


            <button onclick="window.print()">
                ▣ AKTE DRUCKEN
            </button>


            <button
                class="logout"
                onclick="logout()"
            >
                ABMELDEN
            </button>

        </aside>



        <!-- ================================================= -->
        <!-- CONTENT                                           -->
        <!-- ================================================= -->

        <main
            class="content"
            id="content"
        ></main>


    </div>

</div>



<script>


/* ================================================= */
/* SUPABASE                                           */
/* ================================================= */

const SUPABASE_URL =
    "https://sdlrttsluqtuupapeymt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_2lRZ9Tw11ORGQEWeWVDqYg_x665jjdU";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* ================================================= */
/* LOGIN                                             */
/* ================================================= */

const BENUTZERNAME = "REPUBLIKADMIN";

const PASSWORT = "ALLFDL1574";


function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;


    if (
        username === BENUTZERNAME &&
        password === PASSWORT
    ) {

        document.getElementById("login").style.display =
            "none";

        document.getElementById("system").style.display =
            "block";

        zeigeStartseite();

    } else {

        document.getElementById("error").innerText =
            "ZUGRIFF VERWEIGERT";

    }

}


/* ENTER = LOGIN */

document.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter" &&
        document.getElementById("login").style.display !== "none"
    ) {

        login();

    }

});



/* ================================================= */
/* LOGOUT                                            */
/* ================================================= */

function logout() {

    document.getElementById("system").style.display =
        "none";

    document.getElementById("login").style.display =
        "flex";

    document.getElementById("username").value = "";

    document.getElementById("password").value = "";

    document.getElementById("error").innerText = "";

}



/* ================================================= */
/* PERSONENDATEN                                     */
/* ================================================= */

const personen = [

    {
        name: "Maximillian Pütz",
        nummer: "0001"
    },

    {
        name: "Linus Gabriel Ersin Oster",
        nummer: "0002"
    },

    {
        name: "Leon Wallenfang",
        nummer: "0003"
    },

    {
        name: "Oskar Michels",
        nummer: "0004"
    },

    {
        name: "Tammo Kress",
        nummer: "0005"
    },

    {
        name: "Albert Wünscher",
        nummer: "0006"
    },

    {
        name: "Lukas Hilberath",
        nummer: "0007"
    },

    {
        name: "Diego Fernando Schaefer",
        nummer: "0008"
    }

];


function personenNummer(name) {

    const person =
        personen.find(
            p => p.name === name
        );

    return person
        ? person.nummer
        : "9999";

}



/* ================================================= */
/* STARTSEITE                                        */
/* ================================================= */

async function zeigeStartseite() {

    const {
        data: fahndungen,
        error
    } = await supabaseClient
        .from("fahndungen")
        .select("*");


    const anzahlFahndungen =
        error
            ? 0
            : fahndungen.length;


    document.getElementById("content").innerHTML = `

        <div class="document">

            <div class="document-header">

                <h1>
                    ZENTRALES AKTENREGISTER
                </h1>

                <p>
                    Republik Arstotzka
                </p>

            </div>


            <div class="warning-box">

                <strong>
                    INTERNES SYSTEM
                </strong>

                <br><br>

                Zugriff nur für autorisiertes
                Personal der Republik Arstotzka.

            </div>


            <div class="dashboard-grid">


                <div class="stat-card">

                    <div class="stat-title">
                        Personenakten
                    </div>

                    <div class="stat-number">
                        ${personen.length}
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        Fahndungen
                    </div>

                    <div class="stat-number">
                        ${anzahlFahndungen}
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        System
                    </div>

                    <div class="stat-number">
                        OK
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        Sicherheitsstufe
                    </div>

                    <div class="stat-number">
                        III
                    </div>

                </div>


            </div>


            <h2>
                SCHNELLZUGRIFF
            </h2>


            <div class="field">

                <button
                    onclick="zeigePersonen()"
                >
                    PERSONENAKTEN ÖFFNEN
                </button>

            </div>


            <div class="field">

                <button
                    onclick="zeigeFahndung()"
                >
                    FAHNDUNGSLISTE ÖFFNEN
                </button>

            </div>


            <div class="field">

                <strong>
                    SYSTEMSTATUS:
                </strong>

                <span class="badge badge-success">
                    ONLINE
                </span>

            </div>

        </div>

    `;

}



/* ================================================= */
/* PERSONENAKTEN                                     */
/* ================================================= */

function zeigePersonen() {

    document.getElementById("content").innerHTML = `

        <div class="document">

            <div class="document-header">

                <h1>
                    PERSONENAKTEN
                </h1>

                <p>
                    Zentrales Personenregister
                </p>

            </div>


            <div class="search-box">

                <input
                    id="personSearch"
                    type="text"
                    placeholder="Person suchen..."
                    oninput="suchePersonen()"
                >

            </div>


            <div
                id="personenListe"
                class="person-list"
            ></div>

        </div>

    `;


    renderePersonen(personen);

}



function renderePersonen(liste) {

    const container =
        document.getElementById("personenListe");


    if (liste.length === 0) {

        container.innerHTML = `

            <div class="field">

                Keine Person gefunden.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    liste.forEach(person => {

        const div =
            document.createElement("div");


        div.className =
            "person-card";


        div.onclick = function() {

            zeigeAkte(person.name);

        };


        div.innerHTML = `

            <div class="person-name">

                ${person.name}

            </div>

            <div class="person-id">

                AKTENNUMMER:
                AR-${person.nummer}

            </div>

        `;


        container.appendChild(div);

    });

}



function suchePersonen() {

    const suchtext =
        document
            .getElementById("personSearch")
            .value
            .toLowerCase();


    const ergebnis =
        personen.filter(
            person =>
                person.name
                    .toLowerCase()
                    .includes(suchtext)
        );


    renderePersonen(ergebnis);

}



/* ================================================= */
/* PERSONENAKTE                                      */
/* ================================================= */

async function zeigeAkte(name) {

    const {
        data: fahndungen,
        error
    } = await supabaseClient

        .from("fahndungen")

        .select("*")

        .eq("name", name)

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        alert(
            "Die Akte konnte nicht geladen werden:\n" +
            error.message
        );

        return;

    }


    let fahndungsHTML = "";


    if (
        !fahndungen ||
        fahndungen.length === 0
    ) {

        fahndungsHTML = `

            <div class="field">

                <span class="badge badge-success">
                    KEINE FAHNDUNG
                </span>

                <br><br>

                Für diese Person liegt derzeit
                keine aktive Fahndung vor.

            </div>

        `;

    } else {

        fahndungen.forEach(f => {

            const datum =
                f.created_at
                    ? new Date(
                        f.created_at
                    ).toLocaleString(
                        "de-DE"
                    )
                    : "Unbekannt";


            fahndungsHTML += `

                <div class="fahndung-card">

                    <h3>
                        ${escapeHTML(f.grund)}
                    </h3>

                    <div class="fahndung-meta">

                        EINGETRAGEN:
                        ${datum}

                    </div>


                    <span class="badge badge-danger">

                        ${escapeHTML(f.status)}

                    </span>


                    <br><br>


                    <button
                        class="danger small"
                        onclick="loescheFahndung(${f.id}, '${escapeAttribute(name)}')"
                    >

                        FAHNDUNG LÖSCHEN

                    </button>

                </div>

            `;

        });

    }



    document.getElementById("content").innerHTML = `

        <div class="document">


            <div class="document-header">

                <h1>
                    PERSONENAKTE
                </h1>

                <p>
                    REPUBLIK ARSTOTZKA
                </p>

            </div>


            <div class="field">

                <div class="field-title">
                    Vollständiger Name
                </div>

                <div class="field-value">
                    ${escapeHTML(name)}
                </div>

            </div>


            <div class="field">

                <div class="field-title">
                    Aktennummer
                </div>

                <div class="field-value">
                    AR-${personenNummer(name)}
                </div>

            </div>


            <div class="field">

                <div class="field-title">
                    Staatsangehörigkeit
                </div>

                Arstotzkanisch

            </div>


            <div class="field">

                <div class="field-title">
                    Aktenstatus
                </div>

                <span class="badge badge-success">
                    AKTIV
                </span>

            </div>


            <h2>
                FAHNDUNGSSTATUS
            </h2>


            ${fahndungsHTML}


            <h2>
                NEUE FAHNDUNG
            </h2>


            <div class="field">


                <label>
                    Fahndungsgrund
                </label>


                <input
                    id="fahndungsgrund"
                    type="text"
                    placeholder="z.B. Schwerer Diebstahl"
                >


                <label>
                    Fahndungsstatus
                </label>


                <select id="fahndungsstatus">

                    <option value="Gesucht">
                        Gesucht
                    </option>

                    <option value="Dringend gesucht">
                        Dringend gesucht
                    </option>

                    <option value="Zur Festnahme ausgeschrieben">
                        Zur Festnahme ausgeschrieben
                    </option>

                    <option value="Staatssicherheitsrelevant">
                        Staatssicherheitsrelevant
                    </option>

                </select>


                <label>
                    Priorität
                </label>


                <select id="fahndungsprioritaet">

                    <option value="Normal">
                        Normal
                    </option>

                    <option value="Hoch">
                        Hoch
                    </option>

                    <option value="Kritisch">
                        Kritisch
                    </option>

                </select>


                <button
                    onclick="fuegeFahndungHinzu('${escapeAttribute(name)}')"
                >

                    FAHNDUNG EINTRAGEN

                </button>


            </div>


            <h2>
                AKTENVERMERK
            </h2>


            <div class="field">

                <textarea
                    id="aktennotiz"
                    placeholder="Interne Notiz zur Person..."
                ></textarea>


                <button
                    onclick="speichereNotiz('${escapeAttribute(name)}')"
                >

                    NOTIZ SPEICHERN

                </button>

            </div>


            <br>


            <button
                class="secondary"
                onclick="zeigePersonen()"
            >

                ← ZURÜCK ZU DEN PERSONENAKTEN

            </button>


        </div>

    `;

}



/* ================================================= */
/* FAHNDUNG EINTRAGEN                                */
/* ================================================= */

async function fuegeFahndungHinzu(name) {

    const grund =
        document
            .getElementById("fahndungsgrund")
            .value
            .trim();


    const status =
        document
            .getElementById("fahndungsstatus")
            .value;


    const prioritaet =
        document
            .getElementById("fahndungsprioritaet")
            .value;


    if (!grund) {

        alert(
            "Bitte einen Fahndungsgrund eingeben."
        );

        return;

    }


    const { error } =
        await supabaseClient

            .from("fahndungen")

            .insert({

                name: name,

                grund: grund,

                status:
                    status +
                    " | Priorität: " +
                    prioritaet

            });


    if (error) {

        console.error(error);

        alert(
            "Fehler beim Eintragen:\n" +
            error.message
        );

        return;

    }


    alert(
        "Fahndung erfolgreich eingetragen."
    );


    zeigeAkte(name);

}



/* ================================================= */
/* FAHNDUNG LÖSCHEN                                  */
/* ================================================= */

async function loescheFahndung(id, name) {

    const bestaetigt =
        confirm(
            "Soll diese Fahndung wirklich gelöscht werden?"
        );


    if (!bestaetigt) {

        return;

    }


    const { error } =
        await supabaseClient

            .from("fahndungen")

            .delete()

            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Fehler beim Löschen:\n" +
            error.message
        );

        return;

    }


    zeigeAkte(name);

}



/* ================================================= */
/* FAHNDUNGSLISTE                                    */
/* ================================================= */

async function zeigeFahndung() {

    const {
        data: fahndungen,
        error
    } = await supabaseClient

        .from("fahndungen")

        .select("*")

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        alert(
            "Fahndungen konnten nicht geladen werden:\n" +
            error.message
        );

        return;

    }


    let liste = "";


    if (
        !fahndungen ||
        fahndungen.length === 0
    ) {

        liste = `

            <div class="field">

                <span class="badge badge-success">
                    KEINE AKTIVEN FAHNDUNGEN
                </span>

                <br><br>

                Derzeit sind keine Personen
                zur Fahndung ausgeschrieben.

            </div>

        `;

    } else {


        fahndungen.forEach(f => {

            const datum =
                f.created_at
                    ? new Date(
                        f.created_at
                    ).toLocaleString(
                        "de-DE"
                    )
                    : "Unbekannt";


            liste += `

                <div class="fahndung-card">


                    <h3>
                        ${escapeHTML(f.name)}
                    </h3>


                    <div class="fahndung-meta">

                        AKTENNUMMER:
                        AR-${personenNummer(f.name)}

                        <br>

                        EINGETRAGEN:
                        ${datum}

                    </div>


                    <strong>
                        GRUND:
                    </strong>

                    <br>

                    ${escapeHTML(f.grund)}

                    <br><br>


                    <span class="badge badge-danger">

                        ${escapeHTML(f.status)}

                    </span>


                    <br><br>


                    <button
                        onclick="zeigeAkte('${escapeAttribute(f.name)}')"
                    >

                        PERSONENAKTE ÖFFNEN

                    </button>


                    <button
                        class="danger"
                        onclick="loescheFahndung(${f.id}, '${escapeAttribute(f.name)}')"
                    >

                        LÖSCHEN

                    </button>


                </div>

            `;

        });

    }



    document.getElementById("content").innerHTML = `

        <div class="document">


            <div class="document-header">

                <h1>
                    FAHNDUNGSREGISTER
                </h1>

                <p>
                    Zentrale Fahndungsübersicht
                </p>

            </div>


            <div class="warning-box">

                <strong>
                    AMTLICHE FAHNDUNGSDATEN
                </strong>

                <br><br>

                Alle nachfolgenden Einträge sind
                interne RP-Datensätze.

            </div>


            ${liste}


        </div>

    `;

}



/* ================================================= */
/* STATISTIK                                         */
/* ================================================= */

async function zeigeStatistik() {

    const {

    } = await supabaseClient

        .from("fahndungen")

        .select("*");


    if (error) {

        alert(

        );

    }


    const normal =
        fahndungen.filter(

    const kritisch =
        fahndungen.filter(

/* ================================================= */
/* NOTIZEN                                           */
/* ================================================= */

function speichereNotiz(name) {

    const notiz =
        document
            .getElementById("aktennotiz")
            .value
            .trim();


    if (!notiz) {

        alert(
            "Bitte zuerst eine Notiz eingeben."
        );

        return;

    }


    alert(
        "Notiz wurde für diese Sitzung vorgemerkt.\n\n" +
        "Für eine dauerhafte Speicherung müssen wir " +
        "noch eine eigene Notiz-Tabelle in Supabase anlegen."
    );

}



/* ================================================= */
/* SICHERHEIT                                       */
/* ================================================= */

function escapeHTML(text) {

    return String(text)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


function escapeAttribute(text) {

    return String(text)

        .replaceAll("\\", "\\\\")

        .replaceAll("'", "\\'");

}


</script>
